# 숨은길 리버스 프록시 — nginx (Oracle Always Free ARM VM, 단일 호스트)
#
# 라우팅:
#   /      -> frontend:3000 (Next.js)
#   /api/  -> backend:8000  (FastAPI, 경로 prefix 그대로 전달)
#   /health, /docs, /openapi.json -> backend (운영/문서용)
#
# 프론트와 API 가 같은 오리진(http://<VM_IP>)이 되므로 브라우저 CORS 프리플라이트가
# 사실상 발생하지 않는다. 그래도 백엔드 CORS_ORIGINS 는 방어적으로 설정해 둔다.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 버전 노출 차단(보안 기본기).
    server_tokens off;

    ##########################################################################
    # 로그 포맷 — 쿼리스트링을 기록하지 않는다.
    #   기본 combined 포맷의 $request 는 "GET /path?serviceKey=... HTTP/1.1" 처럼
    #   **쿼리스트링을 통째로** 남긴다. 이 서비스의 상류 호출/일부 파라미터에는 키·검색어가
    #   실릴 수 있어(01-backend-design.md L3 규칙: 시크릿·개인정보 로그 금지)
    #   $uri(정규화된 경로, 쿼리 제외)만 남기는 커스텀 포맷을 쓴다.
    ##########################################################################
    log_format  no_query  '$remote_addr - [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time '
                          '"$http_referer" "$http_user_agent"';
    # 공식 nginx 이미지에서 이 경로는 /dev/stdout 심볼릭 링크다(docker logs 로 보임).
    access_log  /var/log/nginx/access.log  no_query;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 업로드 기능이 없다 — 큰 바디는 전부 거부(POST 본문은 온보딩 답변/스팟 id 배열 수준).
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    ##########################################################################
    # Docker 내장 DNS — 컨테이너 재시작으로 IP 가 바뀌어도 nginx 가 다시 해석하도록.
    #   proxy_pass 에 이름을 "그대로" 쓰면 nginx 는 기동 시 1회만 해석하고 캐시한다.
    #   backend 를 재시작하면 IP 가 바뀌어 502 가 계속 뜨는 흔한 함정 → 변수로 우회.
    #   변수를 쓰면 URI 자동 전달이 꺼지므로 $request_uri 를 명시적으로 붙인다.
    ##########################################################################
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket 업그레이드용 Connection 헤더.
    #   일반 HTTP 요청($http_upgrade 가 빈 값)에 Connection: upgrade 를 그대로 박으면
    #   업스트림 keepalive 가 깨진다 → map 으로 분기하는 것이 표준 패턴이다.
    #   (현재 앱은 WebSocket 을 쓰지 않지만, 향후 추가돼도 이 설정이면 그대로 동작한다.)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ##########################################################################
    # 스캐너/악성봇 차단 (2026-08-23, 대표 지시)
    #   실제 로그에서 확인된 패턴 — zgrab(인터넷 전수 스캐너), 취약점 스캐너류가 존재하지
    #   않는 워드프레스/PHP 경로를 매 시간 두드린다. 앱은 순수 Next.js+FastAPI라 PHP 실행기
    #   자체가 없어 직접적인 침해 위험은 없지만, 로그 소음·불필요한 요청 처리를 줄인다.
    #   구글/네이버 같은 정상 검색엔진 크롤러, Grafana(운영 지표 조회), curl(헬스체크 등
    #   우리 자동화) 은 여기 걸리지 않는다 — 이름이 알려진 스캐너 도구만 넣는다.
    #   (IP 기준 차단은 안 한다 — 스캐너는 IP를 계속 바꾸고, 정상 사용자를 오차단할 위험이
    #   더 크다. User-Agent + 경로 패턴 기준이 실질적으로 더 안전하다.)
    ##########################################################################
    map $http_user_agent $blocked_agent {
        default 0;
        "~*zgrab"                 1;
        "~*masscan"                1;
        "~*nmap"                   1;
        "~*nikto"                  1;
        "~*sqlmap"                 1;
        "~*nuclei"                 1;
        "~*dirbuster"              1;
        "~*gobuster"               1;
        "~*wpscan"                 1;
        "~*acunetix"               1;
        "~*netsparker"             1;
        "~*censys"                 1;
        "~*shodan"                 1;
        "~*libwww-perl"            1;
        "~*python-urllib"          1;
    }

    # ==========================================================================
    # HTTP(80) — ACME 갱신 검증 + HTTPS 리다이렉트 전용 (2026-08-09)
    #   80 을 닫으면 인증서 갱신이 "조용히" 실패한다. 반드시 열어둔다.
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # 갱신 검증 파일. 아래 리다이렉트보다 먼저 확정돼야 하므로 ^~ 를 쓴다.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            access_log off;
        }

        # 모니터링이 http 로 찌를 수 있으니 리다이렉트에서 제외한다.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok
";
        }

        # 기존 http://3.35.77.85/... 링크도 여기서 그대로 살아난다.
        location / {
            return 301 https://sumeungil.co.kr$request_uri;
        }
    }

    # ==========================================================================
    # 443 기본 서버 (2026-09-14, 보안감사 "malformed Host" 항목) — 우리 도메인이 아닌 Host 로
    # 들어온 TLS 요청은 어느 사이트 블록에도 태우지 않고 연결을 끊는다(444). IP 직접 접근·
    # 스캐너·호스트 헤더 조작이 여기로 떨어진다. 인증서는 핸드셰이크용으로만 같은 것을 쓴다.
    # ==========================================================================
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/sumeungil.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sumeungil.co.kr/privkey.pem;
        return 444;
    }

    # ==========================================================================
    # www → apex 정규화. 오리진을 하나로 모아 CORS 문제를 원천 차단한다.
    #   (프론트 번들의 API_BASE 가 apex 절대주소라, www 로 들어오면 크로스 오리진이 된다)
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name www.sumeungil.co.kr;

        ssl_certificate     /etc/letsencrypt/live/sumeungil.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sumeungil.co.kr/privkey.pem;

        return 301 https://sumeungil.co.kr$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name sumeungil.co.kr;

        # ---- TLS (Let's Encrypt, 2026-08-09 발급 / 만료 2026-11-07) ----
        ssl_certificate     /etc/letsencrypt/live/sumeungil.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sumeungil.co.kr/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # HSTS (2026-09-14, 보안감사 Mn-7·L-5 이월분): max-age 를 **1일**로 짧게 건다.
        #   인증서 자동갱신 첫 성공(10월 초 예정)을 아직 못 봤으므로, 갱신 실패 시 브라우저가
        #   http 폴백을 거부하는 시간이 하루를 넘지 않게 한다. 갱신 성공 확인 뒤 31536000 으로 올린다.
        #   includeSubDomains·preload 는 붙이지 않는다(www 는 301 로 apex 에 합쳐지므로 불필요).
        # CSP Report-Only (2026-09-14, Mn-7 준비): 정책을 **적용하지 않고 위반만 보고**받는다
        #   (/api/v1/csp-report → GET /api/v1/health/csp 로 집계 확인). 며칠 관찰해 위반 0 이면
        #   헤더 이름을 Content-Security-Policy 로 바꿔 강제한다. script 'unsafe-inline' 은 Next
        #   인라인 스크립트 때문(nonce 방식 전환은 별도 과제). img https: 는 관광공사 CDN 도메인이
        #   여럿이라 우선 넓게.

        ######################################################################
        # 보안 헤더 (2026-08-10, 5차 보안점검 지적 — Mn-7 의 HSTS 제외분 선적용)
        #   HSTS 와 달리 이 헤더들은 브라우저에 캐시되지 않아 문제가 생기면 즉시 되돌릴
        #   수 있다 → 갱신 확인을 기다릴 이유가 없어 먼저 넣는다.
        #   CSP 는 frame-ancestors 만 건다. script-src 까지 거는 완전한 CSP 는 Next 인라인
        #   스크립트·Tmap SDK·관광공사 이미지 도메인 목록을 전수 조사한 뒤에만 가능
        #   (섣불리 걸면 운영 화면이 통째로 깨진다) — Mn-7 에서 HSTS 와 함께 처리.
        # !!! nginx 함정: location 에 add_header 가 하나라도 있으면 server 레벨
        #     add_header 는 그 location 에서 전부 무시된다. Cache-Control 을 추가하는
        #     관리자 블록 2곳(/api/v1/admin/, 프론트 관리자 페이지)에 아래 4줄을 반드시
        #     중복 선언할 것.
        ######################################################################
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors \'self\'" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://oapi.map.naver.com https://*.pstatic.net https://*.naver.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.naver.com https://*.pstatic.net https://*.ntruss.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://kauth.kakao.com; report-uri /api/v1/csp-report" always;

        # 공통 프록시 헤더
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # !!! 중요 !!! $proxy_add_x_forwarded_for 를 쓰지 않는다.
        #   그 변수는 클라이언트가 보낸 X-Forwarded-For 앞부분을 그대로 이어붙인다.
        #   백엔드 레이트 리미터는 XFF 의 **첫 값**을 클라이언트 IP 로 쓰므로,
        #   위조 헤더 하나로 IP 별 한도를 무한 우회할 수 있게 된다.
        #   nginx 가 인터넷에 직접 노출된 엣지이므로 $remote_addr 로 **덮어쓴다**.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 기본 타임아웃(일반 조회 API·페이지). LLM 경로는 아래에서 개별 상향.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ---- LB/모니터링용 초경량 헬스 (백엔드까지 가지 않음) ----
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ---- Let's Encrypt ACME HTTP-01 챌린지 (2026-08-09, sumeungil.co.kr) ----
        #   certbot 이 이 디렉터리에 검증 파일을 놓으면 CA 가 **80 포트로** 읽어간다.
        #   443 이 아직 닫혀 있어도 인증서 발급이 되는 이유가 이것이다.
        #   ^~ 를 쓴 이유: 정규식 location 보다 먼저 확정시켜 프록시로 새지 않게 한다.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            access_log off;
        }

        ######################################################################
        # 스캐너/악성봇 차단 (2026-08-23). User-Agent 는 위 http{} 의 $blocked_agent map,
        # 경로는 여기서 정규식으로 직접 — 존재하지 않는 워드프레스/PHP류 경로를 두드리는
        # 요청을 backend/frontend 까지 보내지 않고 nginx 선에서 끊는다.
        # 444 는 nginx 전용 — HTTP 응답 없이 연결만 끊는다(스캐너에게 "뭐가 있다"는 힌트를
        # 하나도 안 준다. 404 조차 정보다).
        ######################################################################
        if ($blocked_agent) {
            return 444;
        }
        location ~* \.(php|php[0-9]|phtml|asp|aspx|jsp|cgi)$ {
            return 444;
        }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes|wp-json|xmlrpc\.php|phpmyadmin|pma|administrator|\.env|\.git|\.svn|vendor/phpunit|actuator) {
            return 444;
        }

        ######################################################################
        # LLM 경로 — 로컬 Ollama 추론이 걸린다. ARM CPU 추론은 개발 PC 보다 느리므로
        # 넉넉히 120s. (백엔드 자체 타임아웃이 더 짧아 실제로는 백엔드가 먼저 graceful
        # 폴백한다 — nginx 504 로 화면이 깨지지 않게 하는 것이 이 설정의 목적이다.)
        ######################################################################
        location /api/v1/tips/ {
            set $up_llm http://backend:8000;
            proxy_pass $up_llm$request_uri;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/v1/courses/ {
            set $up_course http://backend:8000;
            proxy_pass $up_course$request_uri;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/v1/onboarding/ {
            set $up_onb http://backend:8000;
            proxy_pass $up_onb$request_uri;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        ######################################################################
        # 관리자(운영) API — 부록 T
        #
        # 기본 동작은 `location /api/` 와 완전히 같다(백엔드로 그대로 전달). 이 블록을 따로
        # 둔 이유는 **IP 허용목록을 켤 자리**를 만들어 두기 위해서다.
        #
        # 인증 자체는 백엔드가 한다(scrypt 비밀번호 + HMAC 세션 쿠키 + 로그인 5회/분).
        # ADMIN_PASSWORD_HASH 를 설정하지 않으면 백엔드에 이 경로가 아예 없어 404 다.
        # 아래 허용목록은 그 위에 얹는 **선택적 2차 방어선**이다(기본 비활성).
        #
        # [켜는 법] allow/deny 3줄의 `#` 를 지우고 <내 고정 IP> 를 채운 뒤
        #           docker compose restart nginx
        # [주의] 가정용 인터넷·LTE 는 IP 가 수시로 바뀐다. 바뀐 IP 로 접속하면 **본인도 403**
        #        이 되고, VM SSH 로 들어가 이 파일을 고치기 전까지 관리자 화면을 못 쓴다.
        #        고정 IP 가 없다면 켜지 말 것(비밀번호+레이트리밋만으로 운영한다).
        # [확인] 내 현재 공인 IP: curl -s https://ifconfig.me
        ######################################################################
        location /api/v1/admin/ {
            # allow 203.0.113.10;      # <- 대표 고정 IP (여러 개면 줄을 늘린다)
            # allow 203.0.113.0/24;    # <- 대역으로 열 때
            # deny  all;               # <- 위 allow 이외 전부 차단 (반드시 마지막 줄)

            set $up_admin http://backend:8000;
            proxy_pass $up_admin$request_uri;

            # 관리자 화면은 캐시하지 않는다(중간 프록시가 목록을 들고 있으면 안 된다).
            add_header Cache-Control "no-store" always;
            # server 레벨 보안 헤더 중복 선언 — 위 함정 주석 참고(여기 add_header 가 있어
            # 상속이 끊기므로 반드시 다시 적는다).
            add_header X-Frame-Options        "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors \'self\'" always;
            add_header Strict-Transport-Security "max-age=86400" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://oapi.map.naver.com https://*.pstatic.net https://*.naver.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.naver.com https://*.pstatic.net https://*.ntruss.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://kauth.kakao.com; report-uri /api/v1/csp-report" always;
        }

        # ---- 그 외 API (혼잡도/지역/스팟/축제/컬렉션/비교 등) ----
        location /api/ {
            set $up_api http://backend:8000;
            proxy_pass $up_api$request_uri;
        }

        ######################################################################
        # 관리자 화면(프론트 페이지) — frontend/app/ops-37878f1b71/page.tsx 가 이 블록을 쓴다.
        # 위 API 블록과 **같은 IP 목록**을 유지해야 의미가 있다(한쪽만 열면 반쪽짜리 방어).
        # 페이지 자체에는 비밀 데이터가 없다(로그인 폼) — 실질 방어는 API 쪽 블록이다.
        # 경로가 /admin이 아니라 무작위 문자열인 이유(2026-08-18, 대표 지시)는 위 page.tsx
        # 상단 주석 참고 — 흔한 경로 스캔에 안 걸리는 게 한 겹 더 낫다는 판단이다. 경로를
        # 바꾸면 이 location도, frontend/components/Header.tsx의 ADMIN_PATH도 같이 바꿀 것.
        ######################################################################
        location /ops-37878f1b71 {
            # allow 203.0.113.10;
            # deny  all;

            set $up_admin_web http://frontend:3000;
            proxy_pass $up_admin_web$request_uri;
            add_header Cache-Control "no-store" always;
            # server 레벨 보안 헤더 중복 선언 — 상속 끊김 함정(위 주석) 대응.
            add_header X-Frame-Options        "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors \'self\'" always;
            add_header Strict-Transport-Security "max-age=86400" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://oapi.map.naver.com https://*.pstatic.net https://*.naver.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.naver.com https://*.pstatic.net https://*.ntruss.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://kauth.kakao.com; report-uri /api/v1/csp-report" always;
        }

        # ---- 백엔드 운영 엔드포인트 ----
        location = /health {
            set $up_h http://backend:8000;
            proxy_pass $up_h$request_uri;
            access_log off;
        }

        # /metrics — backend의 Prometheus 지표 원본(2026-08-18). 명시적으로 404를 준다.
        # 사실 아래 어떤 location도 backend로 이 경로를 넘기지 않아 이미 도달 불가능하지만
        # (root-level 경로라 `location /api/`에도 안 걸리고 catch-all `/`은 frontend로 감),
        # /docs·/openapi.json 과 같은 이유로 **명시적으로 막아둔다** — 나중에 누가
        # `location /api/`나 catch-all을 넓히는 실수를 해도 이 경로만은 조용히 안 뚫리게.
        # 실제 지표는 prometheus 컨테이너가 도커 내부망에서 직접 긁어간다(외부에 낼 필요 없음).
        location = /metrics {
            return 404;
        }

        ######################################################################
        # 운영 지표 조회 — 그라파나(aitestbed.kr)가 여기로 Prometheus를 쿼리한다
        # (2026-08-18). Prometheus 자체엔 인증이 없어 Basic Auth로 감싼다.
        #
        # [비밀번호 파일 생성] deploy/.env 시크릿들과 같은 자리에서 한 번만:
        #   echo "grafana:$(openssl passwd -apr1 '<새로_생성한_비밀번호>')" > deploy/prom.htpasswd
        # (DEPLOY.md 참고 — 이 파일은 커밋하지 않는다)
        #
        # [그라파나 쪽 설정] Add data source → Prometheus →
        #   URL: https://sumeungil.co.kr/prom/
        #   Auth → Basic Auth 켜기 → User: grafana, Password: 위에서 만든 비밀번호
        ######################################################################
        location /prom/ {
            auth_basic "sumeungil metrics";
            auth_basic_user_file /etc/nginx/prom.htpasswd;

            # !!! 순서 함정(2026-08-23 실측) !!! `set` 은 `rewrite ... break` **앞**에 와야
            # 한다. rewrite 모듈의 `break` 플래그는 그 줄 이후 같은 phase(rewrite phase)의
            # 나머지 지시어 실행을 즉시 멈춘다 — `set` 도 rewrite 모듈 소속이라 break 뒤에
            # 있으면 아예 실행되지 않는다. 그 결과 $up_prom 이 비어("using uninitialized
            # up_prom variable") proxy_pass 가 500 을 냈다(에러로그로 실측 확인, 여태 아무도
            # /prom/ 을 정상 인증으로 두드려본 적이 없어 발견 못한 채 방치돼 있었다).
            set $up_prom http://prometheus:9090;
            # /prom/ 접두사를 벗겨 Prometheus 자신의 경로(/api/v1/query 등)로 넘긴다.
            rewrite ^/prom/(.*)$ /$1 break;
            proxy_pass $up_prom;

            add_header Cache-Control "no-store" always;
            # server 레벨 보안 헤더 중복 선언 — 상속 끊김 함정(위 주석) 대응.
            add_header X-Frame-Options        "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors \'self\'" always;
            add_header Strict-Transport-Security "max-age=86400" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://oapi.map.naver.com https://*.pstatic.net https://*.naver.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.naver.com https://*.pstatic.net https://*.ntruss.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://kauth.kakao.com; report-uri /api/v1/csp-report" always;
        }

        # Swagger UI / OpenAPI. 공개하고 싶지 않으면 이 두 블록을 지우거나
        # `allow <내 IP>; deny all;` 을 추가한다(DEPLOY.md 참고).
        # /openapi.json — 대화형 API 문서. 2026-08-09 보안 점검 M-4 로 차단했다.
        #   ① 관리자 엔드포인트 13개(삭제 포함)가 익명에게 광고된다.
        #   ② FastAPI 기본 Swagger UI 는 **외부 CDN 스크립트를 우리 오리진에서** 실행한다 —
        #      CDN 이 오염되면 관리자가 로그인한 브라우저에서 same-origin 요청이 나간다.
        # 앱(main.py)에서도 production 이면 끄지만, 여기서 한 겹 더 막는다.
        location = /openapi.json {
            return 404;
        }
        # /docs — 대화형 API 문서. 2026-08-09 보안 점검 M-4 로 차단했다.
        #   ① 관리자 엔드포인트 13개(삭제 포함)가 익명에게 광고된다.
        #   ② FastAPI 기본 Swagger UI 는 **외부 CDN 스크립트를 우리 오리진에서** 실행한다 —
        #      CDN 이 오염되면 관리자가 로그인한 브라우저에서 same-origin 요청이 나간다.
        # 앱(main.py)에서도 production 이면 끄지만, 여기서 한 겹 더 막는다.
        location /docs {
            return 404;
        }

        # ---- 나머지 전부 프론트엔드 ----
        location / {
            set $up_web http://frontend:3000;
            proxy_pass $up_web$request_uri;
        }
    }
}
