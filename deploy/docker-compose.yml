# 숨은길 단일 호스트 배포 — CPU 2 vCPU / RAM 16GB / GPU 없음
#
# 서비스 6개를 VM 한 대에 올린다:
#   nginx      : 유일하게 호스트 80 포트를 여는 엣지. 나머지는 내부 네트워크에서만 접근 가능.
#   frontend   : Next.js 15 (next start)
#   backend    : FastAPI (uvicorn, 워커 1개 — 인메모리 캐시/레이트리밋 때문)
#   postgres   : 저장소(리뷰·공유코스·로그인 계정·온보딩 프로필·AI 코스). 2026-08-17 SQLite에서
#                전환(대표 지시) — backend 만 접근하고 호스트 포트는 열지 않는다.
#   ollama     : 로컬 LLM 추론(qwen3:4b-instruct-2507-q4_K_M). 모델 파일은 named volume 에 보존.
#   prometheus : 운영 지표 저장소(2026-08-18, 그라파나 aitestbed.kr 연동). backend:8000/metrics
#                를 긁어 보관한다. postgres와 같은 원칙 — 호스트 포트는 안 열고, nginx의
#                /prom/(Basic Auth) 를 통해서만 외부(그라파나)가 조회한다.
#
# 실행 위치: 이 파일이 있는 deploy/ 디렉터리에서 `docker compose up -d --build`
# 환경변수:  같은 디렉터리의 `.env` 하나로 전부 처리한다(backend 런타임 + frontend 빌드인자).
#            → backend/.env.production.example 을 복사해서 만든다. DEPLOY.md (e) 참고.
#
# ARM64: 아래 세 이미지(python:3.12-slim / node:20-alpine / nginx:1.27-alpine)와
#        ollama/ollama 모두 linux/arm64 매니페스트를 제공한다. platform 지정 불필요.
#
# 포트 공개 원칙(보안): backend/frontend/ollama 에는 `ports:` 를 두지 않는다.
#   - ollama 는 인증이 없다. 호스트에 노출되면 누구나 VM 의 CPU 로 추론을 돌릴 수 있다.
#   - backend 가 직접 노출되면 nginx 가 세팅하는 X-Forwarded-For 를 우회해
#     레이트 리밋을 무력화할 수 있다(rate_limit.py 신뢰 경계 주석 참고).
#   디버깅이 필요하면 `docker compose exec` 로 컨테이너 안에서 curl 한다.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sumeungil-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # HTTPS 는 도메인 확보 후 (DEPLOY.md 부록) — 그때 443 을 여기에 추가한다.
      # 2026-08-09 도메인(sumeungil.co.kr) 확보로 HTTPS 개시.
      # 80 은 ACME 검증과 https 리다이렉트용으로 계속 열어둔다(닫으면 갱신이 깨진다).
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # certbot 과 공유. nginx 는 읽기만 하면 된다.
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      # /prom/ Basic Auth 비밀번호 파일(2026-08-18). 커밋 안 함 — DEPLOY.md 참고.
      - ./prom.htpasswd:/etc/nginx/prom.htpasswd:ro
    depends_on:
      - frontend
      - backend
      - prometheus
    networks:
      - sumeungil

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # !!! 빌드타임 값 !!! NEXT_PUBLIC_* 는 번들에 인라인된다.
        # 값을 바꾸면 반드시 `docker compose build frontend` 재빌드가 필요하다.
        # NEXT_PUBLIC_API_BASE 는 "브라우저가 보는 주소" — nginx 가 /api 를 백엔드로
        # 넘기므로 프론트와 동일 오리진(http://<VM_IP>)을 넣는다. 컨테이너 이름(backend:8000)을
        # 넣으면 안 된다(브라우저는 도커 네트워크를 모른다).
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_TMAP_APP_KEY: ${NEXT_PUBLIC_TMAP_APP_KEY}
        # 2026-08-24: 추천 화면 지도(SpotMap.tsx)를 네이버 지도로 교체 — Tmap appKey가
        # IP 화이트리스트라 브라우저에서 영구히 막혀 있던 문제 회피(도메인 화이트리스트라
        # 이 문제가 없다). CourseMap.tsx(AI 코스짜기 경로선)는 그대로 Tmap 유지.
        NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID}
    container_name: sumeungil-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - sumeungil

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sumeungil-backend
    restart: unless-stopped
    environment:
      SUMMARY_STORE_DIR: /app/data/ai-summaries
    # 런타임 시크릿/설정. 이미지에는 굽지 않는다(.dockerignore 가 .env 제외).
    # config.py 는 /app/.env 가 없으면 프로세스 환경변수를 그대로 읽는다.
    env_file:
      - .env
    # 과거 SQLite 이관본을 잠시 보존하는 레거시 볼륨. 현재 사용자 데이터의 정본은
    # postgres 서비스의 postgres-data 볼륨이다.
    volumes:
      - sumeungil-data:/app/data
    expose:
      - "8000"
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - sumeungil

  postgres:
    image: postgres:16-alpine
    container_name: sumeungil-postgres
    restart: unless-stopped
    # .env(POSTGRES_DB/USER/PASSWORD)에서 읽는다 — backend의 DATABASE_URL과 값이 일치해야 한다.
    env_file:
      - .env
    # !!! 사용자 데이터 보존 !!! reviews/shared_courses/users/온보딩 프로필/AI 코스 전부
    # 여기 있다. 이 볼륨이 없으면 배포할 때마다 전부 사라진다(sumeungil-data와 동급 취급).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # backend 외 누구도 접근할 필요 없다(nginx/ollama와 동일한 "호스트 미노출" 원칙).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sumeungil} -d ${POSTGRES_DB:-sumeungil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sumeungil

  # PostgreSQL 자동 백업. 기동 직후 1회, 이후 기본 24시간마다 custom-format dump를 만들고
  # pg_restore로 읽기 검증한다. BACKUP_S3_URI를 설정하면 AES-256 서버측 암호화로 S3 호환
  # 외부 저장소에도 올린다. 로컬 사본은 deploy/backups/에 기본 14일 보관한다.
  postgres-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: sumeungil-postgres-backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last-success && last=$$(cat /backups/.last-success) && now=$$(date +%s) && test $$((now-last)) -lt $${BACKUP_MAX_AGE_SECONDS:-93600} && { test -z \"$${BACKUP_S3_URI:-}\" || { test -f /backups/.last-offsite-success && remote=$$(cat /backups/.last-offsite-success) && test $$((now-remote)) -lt $${BACKUP_MAX_AGE_SECONDS:-93600}; }; }"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 5m
    networks:
      - sumeungil

  prometheus:
    # 태그 고정 원칙은 ollama/certbot과 동일(2026-08-18 외부 보안감사 2차 — `latest` 는
    # 재배포마다 무엇이 올라올지 모르는 태그라 장애 원인을 되짚을 수 없다).
    image: prom/prometheus:v3.0.1
    container_name: sumeungil-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 90일치만 보관 — postgres/sumeungil-data 와 달리 다시 만들 수 있는 데이터라
      # (재수집 불가한 과거분만 사라짐) sumeungil-data 급의 백업 대상은 아니다.
      - --storage.tsdb.retention.time=90d
    # postgres 와 동일 원칙 — backend/nginx 외 누구도 직접 접근할 필요 없다.
    expose:
      - "9090"
    networks:
      - sumeungil

  ollama:
    # 2026-08-18(외부 보안감사 2차) — `latest` 는 재배포마다 무엇이 올라올지 모르는 태그다.
    # 같은 명령이 어제와 오늘 다른 바이너리를 띄우면 장애 원인을 되짚을 수 없고, 공급망
    # 사고가 나도 "언제부터"를 특정할 수 없다. 고정 태그로 바꾼다.
    #
    # 2026-08-18 확인: 이 태그의 다이제스트는 그 시점 `latest` 와 **동일**하다
    #   sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad (amd64+arm64)
    # 즉 지금 배포 동작은 바뀌지 않는다. 다만 운영 서버가 예전 `latest` 를 물고 있었다면
    # 다음 배포에서 ollama 가 그만큼 올라간다 — 배포 후 `docker compose logs ollama` 로
    # 모델 로드가 정상인지 한 번 확인할 것.
    # 올릴 때는 https://hub.docker.com/r/ollama/ollama/tags 에서 태그를 확인하고 여기만 고친다.
    image: ollama/ollama:0.32.14
    container_name: sumeungil-ollama
    mem_limit: 6g
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
    # 모델 가중치(qwen3:4b-instruct-2507-q4_K_M ≈ 2.5GB)를 컨테이너 밖에 보존한다.
    # 이게 없으면 컨테이너를 다시 만들 때마다 수 GB 를 다시 내려받는다.
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # 모델을 메모리에 계속 올려둔다(-1 = 무기한). 요약 배치에서 반복 로딩을 피하며,
      # 언로드되면 다음 요청이 모델 로딩 수십 초를 그대로 뒤집어쓴다.
      # 메모리를 아끼고 싶으면 "30m" 같은 값으로 바꾼다.
      - OLLAMA_KEEP_ALIVE=-1
      # 2 vCPU 환경에서 동시 추론을 늘리면 전부 같이 느려진다 — 직렬 처리로 고정.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=4
      - OLLAMA_CONTEXT_LENGTH=4096
    # 모델 pull 은 compose 에 넣지 않는다(기동마다 실행되면 느리고, 실패 시 부팅이 막힌다).
    # 최초 1회만 배포 스크립트에서: docker compose exec ollama ollama pull qwen3:4b-instruct-2507-q4_K_M
    expose:
      - "11434"
    networks:
      - sumeungil


  # ---- 인증서 자동 갱신 (2026-08-09) ----
  # Let's Encrypt 인증서는 90일짜리다. 사람이 기억해서 갱신하면 반드시 놓친다.
  # 12시간마다 renew 를 돌린다 — 만료 30일 전이 아니면 certbot 이 아무것도 안 한다.
  # 최초 발급만 `docker compose run --rm certbot certonly ...` 로 한 번 수동 실행한다.
  certbot:
    # 2026-08-18(외부 보안감사 2차) — ollama 와 같은 이유로 고정. 이 컨테이너는 인증서
    # 개인키가 있는 볼륨을 마운트하므로 "어떤 이미지가 도는지 모름" 상태를 더더욱 두면 안 된다.
    # 2026-08-18 확인: 다이제스트가 그 시점 `latest` 와 동일하다
    #   sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4 (amd64+arm+arm64)
    image: certbot/certbot:v5.7.0
    container_name: sumeungil-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'


networks:
  sumeungil:
    driver: bridge

volumes:
  ollama-models:
  # 2026-08-17부터 실제 사용자 데이터는 postgres-data가 정본이다(sumeungil-data는 과거
  # SQLite 파일의 잔재 — 이관 스크립트가 다 읽으면 삭제해도 되지만, 안전을 위해 당분간
  # 볼륨 정의만 남겨둔다). ollama-models 와 달리 **다시 만들 수 없는 데이터**다 —
  # `docker compose down -v` 는 이 볼륨들까지 지운다. 백업 절차는 DEPLOY.md "백업" 항목 참고.
  sumeungil-data:
  postgres-data:
  prometheus-data:
