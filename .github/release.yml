changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: 🚀 배포/릴리스
      labels:
        - release
    - title: ✨ 새로운 기능
      labels:
        - enhancement
    - title: 🐛 버그 수정
      labels:
        - bug
    - title: 🔐 보안
      labels:
        - security
    - title: 📝 문서
      labels:
        - documentation
    - title: 🔧 기타
      labels:
        - "*"
