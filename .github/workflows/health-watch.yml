name: 서버 상태 감시

# sumeungil.co.kr 이 죽었는지/degraded 인지 밖에서 확인해 #알림-봇 으로 알린다.
# 서버 안에서 도는 감시는 서버가 통째로 죽으면 같이 죽는다 — 그래서 밖(GitHub 러너)에서 본다.
#
# ## 주기를 30분으로 잡은 이유 (바꾸기 전에 반드시 읽을 것)
# 이 저장소는 **비공개**다. 비공개 저장소의 Actions 무료 한도는 계정당 월 2,000분이고,
# GitHub 은 잡 하나를 **1분 단위로 올림 청구**한다(20초 걸려도 1분).
#   · 5분 간격  = 8,640회/월 → 최소 8,640분  ❌ 한도의 4배 초과(요금 발생)
#   · 10분 간격 = 4,320회/월 → 최소 4,320분  ❌ 초과
#   · 30분 간격 = 1,440회/월 → 최소 1,440분  ✅ 한도 안 (약 560분 여유)
# 더 촘촘한 감시(1~5분)가 필요하면 Actions 주기를 줄이지 말고 **외부 무료 업타임 모니터**
# (UptimeRobot 등)를 쓸 것 — 그쪽은 GitHub 분수를 전혀 쓰지 않는다. deploy/SLACK-ALERTS.md 참고.
#
# ## 알림 폭탄 방지
# 서버가 6시간 죽어 있으면 30분마다 12번 알릴 필요가 없다. **상태가 바뀔 때만** 보낸다
# (정상→이상, 이상→복구). 직전 실행의 conclusion 을 GitHub API 로 읽어 판정하고, 이 잡은
# 이상일 때 스스로 실패(exit 1)해 상태를 conclusion 에 기록한다.
#
# ## 알아둘 제약
# · GitHub 의 schedule 은 정시 보장이 아니다(혼잡하면 수분~십수분 지연, 드물게 스킵).
# · **60일간 저장소에 아무 활동이 없으면 스케줄 워크플로가 자동 비활성화된다.** 심사 기간
#   (10~12월)에 커밋이 끊기면 감시도 멈추므로, 그때는 Actions 탭에서 켜져 있는지 볼 것.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:        # 수동 실행(지금 당장 확인하고 싶을 때)

permissions:
  contents: read
  actions: read             # 직전 실행 conclusion 조회용

concurrency:
  group: health-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: 헬스체크 호출
        id: check
        env:
          HEALTH_URL: https://sumeungil.co.kr/api/v1/health
        run: |
          set -uo pipefail

          # --retry 2: 순간적인 네트워크 흔들림으로 오탐하지 않게 3번까지 시도.
          code=$(curl -sS --max-time 10 --retry 2 --retry-delay 5 --retry-all-errors \
                   -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL") || code="000"

          state="down"
          detail=""
          # cause/action: 대표가 "왜 그런지·어떻게 됐고·내가 뭘 해야하는지" 알림에 그대로
          # 실리길 원해서(2026-08-24 지시) 원인별로 미리 사람이 읽을 설명을 붙여둔다.
          # action=none  → 외부 원인, 보통 자동 복구, 대표가 할 일 없음
          # action=check → 우리 쪽 문제일 가능성, 반복되면 개발팀(오케스트레이터) 확인 필요
          cause=""
          action="check"
          if [ "$code" = "200" ]; then
            st=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
            if [ "$st" = "ok" ]; then
              state="ok"
              detail="정상"
            else
              state="degraded"
              upstream=$(jq -r '.checks.upstream_kto // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
              cache_st=$(jq -r '.checks.cache // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
              detail=$(jq -r '"status=\(.status) · 설정=\(.checks.config) · 공공데이터=\(.checks.upstream_kto) · 캐시=\(.checks.cache)"' \
                       /tmp/health.json 2>/dev/null || echo "status=$st")
              if [ "$upstream" = "fail" ] && [ "$cache_st" != "fail" ]; then
                cause="원인: 한국관광공사 공공데이터 API(관광지 혼잡도 원천)가 일시적으로 응답하지 않습니다. 저희가 붙여 쓰는 무료 외부 공공 API라 가끔 흔들리고, 보통 몇 분 안에 저쪽에서 자동으로 복구됩니다."
                action="none"
              elif [ "$cache_st" = "fail" ]; then
                cause="원인: 서버 내부 캐시 오류입니다. 외부 요인이 아니라 우리 서버 쪽 문제일 가능성이 높습니다."
                action="check"
              else
                cause="원인: 설정 점검(config) 이상입니다 — 배포 직후라면 배포 문제일 수 있습니다."
                action="check"
              fi
            fi
          elif [ "$code" = "000" ]; then
            detail="응답 없음 — 연결 실패 또는 10초 타임아웃 (서버·nginx 다운 또는 DNS 문제)"
            cause="원인: 서버 자체가 응답하지 않습니다(프로세스 다운·nginx 다운·DNS 문제 중 하나일 가능성). 외부 원인이 아니라 우리 서버 쪽 문제입니다."
            action="check"
          else
            detail="HTTP $code 응답 — 서버는 살아 있으나 헬스체크가 정상 응답하지 않음"
            cause="원인: 서버 프로세스는 떠 있지만 정상 응답을 못 하고 있습니다."
            action="check"
          fi

          # **stdout 에도 반드시 남긴다.** 요약($GITHUB_STEP_SUMMARY)은 파일이라
          # `gh run view --log` 에 안 나온다. 사후에 "그때 뭐가 fail 이었나"를 CLI 로
          # 확인하려면 stdout 에 있어야 한다(2026-08-18 실제로 이것 때문에 헤맴). 복구 알림도
          # 이 줄을 그대로 읽어("직전 실행 상세 조회" 스텝) "뭐가 문제였는지"를 함께 보낸다.
          echo "판정: 상태=$state / $detail"
          echo "원본 응답: $(cat /tmp/health.json 2>/dev/null | head -c 400)"

          echo "상태=$state / $detail" >> "$GITHUB_STEP_SUMMARY"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          {
            echo "detail<<__EOD__"
            echo "$detail"
            echo "__EOD__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "cause<<__EOD__"
            echo "$cause"
            echo "__EOD__"
          } >> "$GITHUB_OUTPUT"

      - name: 직전 실행 결과 조회
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # 이번 실행은 아직 completed 가 아니므로 목록의 첫 항목이 '직전 실행'이다.
          prev_json=$(gh api "repos/${REPO}/actions/workflows/health-watch.yml/runs?status=completed&per_page=1" \
                   --jq '.workflow_runs[0] | {conclusion: .conclusion, id: .id}' 2>/dev/null || echo '{}')
          prev=$(echo "$prev_json" | jq -r '.conclusion // "none"')
          prev_id=$(echo "$prev_json" | jq -r '.id // ""')
          echo "직전 실행 결과: ${prev:-none} (run ${prev_id:-?})" >> "$GITHUB_STEP_SUMMARY"
          echo "conclusion=${prev:-none}" >> "$GITHUB_OUTPUT"
          echo "run_id=${prev_id}" >> "$GITHUB_OUTPUT"

          # 복구 알림에 "뭐가 문제였는지" 같이 실으려고, 직전(장애) 실행의 판정 로그 한 줄을
          # 미리 가져와 둔다(대표 지시 2026-08-24: "어떻게 해결됐고 뭐가 문제였는지도 알려줘야").
          # 실패해도(로그 조회 자체가 불안정할 수 있음) 복구 알림은 이 줄 없이도 보낸다.
          prev_cause=""
          if [ -n "$prev_id" ]; then
            prev_cause=$(gh run view "$prev_id" --log 2>/dev/null | grep -m1 '판정: ' | sed 's/^.*판정: //') || true
          fi
          {
            echo "prev_cause<<__EOD__"
            echo "$prev_cause"
            echo "__EOD__"
          } >> "$GITHUB_OUTPUT"

      - name: 이상 알림 (정상 → 이상 전환 시에만)
        if: steps.check.outputs.state != 'ok' && steps.prev.outputs.conclusion != 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATE: ${{ steps.check.outputs.state }}
          DETAIL: ${{ steps.check.outputs.detail }}
          CAUSE: ${{ steps.check.outputs.cause }}
          ACTION: ${{ steps.check.outputs.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$STATE" = "down" ]; then
            icon="🔴"; label="서버 응답 없음"
          else
            icon="🟠"; label="서버 성능 저하(degraded)"
          fi
          # 2026-08-24 대표 지시: "왜 그런지·내가 해결해야 하면 그것도" 알림에 그대로 싣는다.
          if [ "$ACTION" = "none" ]; then
            action_line="→ 대표님이 하실 일은 없습니다. 자동으로 복구되면 다시 알려드립니다."
          else
            action_line="→ 우리 쪽 문제일 가능성이 있어 제가 확인하겠습니다. 오래 지속되면 알려주세요."
          fi
          when=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          text=$(printf '%s *%s* — sumeungil.co.kr\n%s\n%s\n%s\n확인 시각: %s KST\n<%s|점검 로그 보기>\n\n복구되면 이 채널에 다시 알립니다.' \
            "$icon" "$label" "$DETAIL" "$CAUSE" "$action_line" "$when" "$RUN_URL")
          payload=$(jq -nc --arg t "$text" '{text: $t, unfurl_links: false}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: 복구 알림 (이상 → 정상 전환 시에만)
        if: steps.check.outputs.state == 'ok' && steps.prev.outputs.conclusion == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PREV_CAUSE: ${{ steps.prev.outputs.prev_cause }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          when=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          # 2026-08-24 대표 지시: 복구 알림에도 "뭐가 문제였는지" 같이 싣는다. 직전 장애 실행의
          # 판정 로그를 못 가져왔으면(조회 실패 등) 그 줄만 빼고 보낸다 — 복구 사실 자체는 확실하다.
          if [ -n "$PREV_CAUSE" ]; then
            text=$(printf '🟢 *서버 복구됨* — sumeungil.co.kr\n직전 문제: %s\n지금은 정상(ok)입니다.\n확인 시각: %s KST' \
              "$PREV_CAUSE" "$when")
          else
            text=$(printf '🟢 *서버 복구됨* — sumeungil.co.kr\n헬스체크가 다시 정상(ok)입니다.\n확인 시각: %s KST' "$when")
          fi
          payload=$(jq -nc --arg t "$text" '{text: $t, unfurl_links: false}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      # 상태를 이 실행의 conclusion 에 남긴다 — 다음 실행이 '전환'을 판정하는 유일한 근거다.
      # 이 스텝을 지우면 이상 상태가 계속돼도 30분마다 알림이 다시 날아온다.
      - name: 이상 상태를 실행 결과에 반영
        if: steps.check.outputs.state != 'ok'
        run: exit 1
