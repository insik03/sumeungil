name: 빌드 및 회귀 검증

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n deploy/backup/backup.sh && sh -n deploy/backup/retention.sh && sh -n deploy/security/host-guard.sh
      - run: python3 deploy/backup/verify_retention.py
      - run: python3 deploy/security/verify_env_isolation.py
      - run: docker compose -f deploy/docker-compose.yml config --no-env-resolution --no-interpolate --quiet
      - run: docker build -t sumeungil-backup-ci deploy/backup
      - name: BusyBox expiry smoke test (no production data)
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint sh sumeungil-backup-ci -c '
            mkdir /tmp/expiry-check
            touch -t 202001010000 /tmp/expiry-check/sumeungil-old.dump
            touch /tmp/expiry-check/sumeungil-new.dump
            BACKUP_DIR=/tmp/expiry-check sh /usr/local/bin/retention.sh once
            test ! -f /tmp/expiry-check/sumeungil-old.dump && test -f /tmp/expiry-check/sumeungil-new.dump
          '
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/verify_saved_spots.cjs
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sumeungil_test
          POSTGRES_USER: sumeungil
          POSTGRES_PASSWORD: verify-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sumeungil -d sumeungil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://sumeungil:verify-only@localhost:5432/sumeungil_test
      PUBLIC_DATA_API_KEY: verify-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - name: Backend image and preprocessing commands
        run: |
          docker build -t sumeungil-backend-ci .
          docker run --rm -e PUBLIC_DATA_API_KEY=verify-only --entrypoint python sumeungil-backend-ci scripts/build_spot_summaries.py --limit 1 --report-only
          docker run --rm -e PUBLIC_DATA_API_KEY=verify-only --entrypoint python sumeungil-backend-ci scripts/build_festival_summaries.py --help
      - name: 결정적 회귀 스크립트 실행
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/verify_*.py; do
            case "$script" in
              scripts/verify_injection_hardening.py|scripts/verify_onboarding_llm.py)
                echo "skip $script (실제 Ollama 모델 필요)"
                ;;
              *)
                echo "run $script"
                python "$script"
                ;;
            esac
          done
