name: 의존성 취약점 감사 (npm audit / pip-audit)

# 3차 보안 감사(2026-08-19)에서 3회 연속 이월된 "Next.js 업그레이드" 같은 문제의 재발
# 방지용. 사람이 기억해뒀다가 감사 때 발견하는 대신, 매주 자동으로 훑어서 Slack 으로
# 먼저 알린다. Dependabot(.github/dependabot.yml)이 PR을 올려주는 것과는 별개로,
# 이건 "지금 이 순간 알려진 취약점이 있는지"를 매주 스냅샷으로 찍는다.
#
# 주 1회라 GitHub Actions 무료 분수 예산에 영향 없음(health-watch.yml 의 30분 주기와
# 비교하면 무시할 수준 — deploy/SLACK-ALERTS.md 참고).
#
# 2026-08-22 보안/QA 병렬 검증 반영:
# - pip-audit 는 backend/requirements-lock.txt 가 아니라 requirements.txt 를 감사한다
#   (Dockerfile 이 실제로 설치하는 파일과 다르면 psycopg 류가 영원히 감사 대상에서
#   빠지는 사고가 났었다 — requirements-lock.txt 상단 주석 참고).
# - 카운트 스크립트가 실패(exit != 0)하면 이 워크플로도 실패해야 한다. count_*.{js,py}
#   는 이제 파싱 실패 시 stderr 로 적고 비정상 종료한다 — `VAR=$(스크립트)` 형태라
#   GitHub Actions 기본 셸(`bash -e`)이 그 실패를 그대로 잡 실패로 전파한다(추가 조치 불필요,
#   `VAR=$(exit 1)` 이 실제로 -e 를 트리거하는 것을 로컬에서 실측 확인함). 스크립트가 죽는
#   것과 "취약점 0건"을 절대 같은 결과로 보이게 하지 않는 게 이번 수정의 핵심이다.
# - "알려진 채로 보류 중인" 건수(예: next@16 로만 고쳐지는 postcss/sharp)까지 매주 알리면
#   알림 피로로 3주 안에 아무도 안 본다 — BASELINE 아래는 조용히 넘어가고 그 위로
#   올라갈 때만(신규 발견) 알린다. next@16 업그레이드가 끝나면 이 숫자를 낮출 것.

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  # 2026-08-22 기준 알려진 미해결 건수(postcss 4건+sharp 1건, next@16 필요 — 이월 확정).
  # next.js 메이저 업그레이드로 해소되면 0으로 낮출 것.
  NPM_HIGH_BASELINE: 3
  PIP_VULNS_BASELINE: 0

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: npm audit (production 의존성만)
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high --json > npm-audit.json || true
          npm audit --omit=dev --audit-level=high || true
      - name: 결과 카운트 추출
        working-directory: frontend
        run: |
          HIGH=$(node ../.github/scripts/count_npm_high.js)
          echo "NPM_HIGH=$HIGH" >> "$GITHUB_ENV"
      - name: Slack 알림 (기준선 초과 시에만)
        if: always() && env.NPM_HIGH != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          if [ "$NPM_HIGH" -le "$NPM_HIGH_BASELINE" ]; then exit 0; fi
          payload=$(printf '{"text":":rotating_light: [의존성 감사] frontend npm audit High/Critical %s건(기준선 %s건 초과) - https://github.com/%s/actions"}' \
            "$NPM_HIGH" "$NPM_HIGH_BASELINE" "$REPO")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
      - name: Slack 알림 (감사 자체가 실패했을 때)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          payload=$(printf '{"text":":warning: [의존성 감사] frontend npm audit 워크플로 자체가 실패했습니다 - 확인 필요 - https://github.com/%s/actions"}' \
            "$REPO")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit
        working-directory: backend
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt -f json -o pip-audit.json || true
          pip-audit -r requirements.txt || true
      - name: 결과 카운트 추출
        working-directory: backend
        run: |
          VULNS=$(python ../.github/scripts/count_pip_vulns.py)
          echo "PIP_VULNS=$VULNS" >> "$GITHUB_ENV"
      - name: Slack 알림 (기준선 초과 시에만)
        if: always() && env.PIP_VULNS != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          if [ "$PIP_VULNS" -le "$PIP_VULNS_BASELINE" ]; then exit 0; fi
          payload=$(printf '{"text":":rotating_light: [의존성 감사] backend pip-audit 취약점 %s건(기준선 %s건 초과) - https://github.com/%s/actions"}' \
            "$PIP_VULNS" "$PIP_VULNS_BASELINE" "$REPO")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
      - name: Slack 알림 (감사 자체가 실패했을 때)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          payload=$(printf '{"text":":warning: [의존성 감사] backend pip-audit 워크플로 자체가 실패했습니다 - 확인 필요 - https://github.com/%s/actions"}' \
            "$REPO")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
