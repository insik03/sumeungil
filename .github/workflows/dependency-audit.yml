name: 의존성 취약점 감사 (npm audit / pip-audit)

# 3차 보안 감사(2026-08-19)에서 3회 연속 이월된 "Next.js 업그레이드" 같은 문제의 재발
# 방지용. 사람이 기억해뒀다가 감사 때 발견하는 대신, 매주 자동으로 훑어서 Slack 으로
# 먼저 알린다. Dependabot(.github/dependabot.yml)이 PR을 올려주는 것과는 별개로,
# 이건 "지금 이 순간 알려진 취약점이 있는지"를 매주 스냅샷으로 찍는다.
#
# 주 1회라 GitHub Actions 무료 분수 예산에 영향 없음(health-watch.yml 의 30분 주기와
# 비교하면 무시할 수준 — deploy/SLACK-ALERTS.md 참고).

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/requirements.txt'
      - 'backend/requirements-lock.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (production 의존성만)
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high --json > npm-audit.json || true
          npm audit --omit=dev --audit-level=high || true
      - name: 결과 카운트 추출
        working-directory: frontend
        run: |
          HIGH=$(node ../.github/scripts/count_npm_high.js)
          echo "NPM_HIGH=$HIGH" >> "$GITHUB_ENV"
      - name: Slack 알림 (high/critical 있을 때만)
        if: env.NPM_HIGH != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          payload=$(printf '{"text":":rotating_light: [의존성 감사] frontend npm audit High/Critical %s건 발견 - %s/actions"}' \
            "$NPM_HIGH" "https://github.com/${{ github.repository }}")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: pip-audit
        working-directory: backend
        run: |
          pip install -q pip-audit
          pip-audit -r requirements-lock.txt -f json -o pip-audit.json || true
          pip-audit -r requirements-lock.txt || true
      - name: 결과 카운트 추출
        working-directory: backend
        run: |
          VULNS=$(python ../.github/scripts/count_pip_vulns.py)
          echo "PIP_VULNS=$VULNS" >> "$GITHUB_ENV"
      - name: Slack 알림 (취약점 있을 때만)
        if: env.PIP_VULNS != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          payload=$(printf '{"text":":rotating_light: [의존성 감사] backend pip-audit 취약점 %s건 발견 - %s/actions"}' \
            "$PIP_VULNS" "https://github.com/${{ github.repository }}")
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
